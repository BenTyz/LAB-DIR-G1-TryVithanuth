<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>

      body{
        margin: 0;
        padding: 0;
      }
  
      .main {
        height: 100%;
        background: #25384B;
        display: flex;

      }

      .left-section {
        background: #A3CFCC;
        margin: 0 3em;
        width: 60%;
      }

      .right-section {
        background: #F7CFB6;
        height: 100vh;
        width: 40%;
        gap: 1em;
        padding: 1em;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
      }

      .item {
        background: #86C2DE;
        height: 100px;
        width: 100%;
        margin: 1em 0;
      }
 
    </style>
  </head>
  <body>
    <div class="main">
      <section class="left-section"></section>
      <section class="right-section">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
      </section>
    </div>
  </body>
</html>
