<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        color: white;
      }
      body{
        height: 100vh;
        margin: 0;
        margin:2em 2em;
        background: rgb(253, 253, 253);
      }
  
      .container {
        height: 100vh;
        background: rgb(249, 249, 249);
        display: flex;
        flex-direction: column;
        gap: 1em;
      }

      header,
      footer {
        background: #1b078e;
        height: 100px;
        border-radius: 10px;
        flex-shrink: 0;
      }
    
      
      main {
        display: flex;
        justify-content: space-between;
        gap: 1em;
        flex-grow:1;
        
      }
      .main{
        background:rgb(23, 232, 0);
        width: 60%;
        display: flex;
        gap: 1em;
        flex-wrap: wrap;
        align-items: center;
        padding: 1em 1em;
        border-radius: 10px;
      }
      .sidebar{
        background: rgb(245, 3, 3);
        width: 40%;
        border-radius: 10px;
      }
      .item{
        background:rgb(1, 88, 1);
        height: 5rem;
        width: 10rem;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;;
      }
      p{
        width: 100%;
        height: 20px;
      }
 
    </style>
  </head>
  <body>
    <div class="container">
      <header>Header</header>
      <main>
        <div class = "main">
          <p>Main</p>
          <div class ="item">Item</div>
          <div class ="item">Item</div>
          <div class ="item">Item</div>
          <div class ="item">Item</div>
          <div class ="item">Item</div>
          <div class ="item">Item</div>
          <div class ="item">Item</div>
          <div class ="item">Item</div>
          <div class ="item">Item</div>
          <div class ="item">Item</div>
          <div class ="item">Item</div>
        </div>
        <div class ="sidebar">Side Bar</div>
      </main>
      <footer>Footer</footer>
      </section>
    </div>
  </body>
</html>
